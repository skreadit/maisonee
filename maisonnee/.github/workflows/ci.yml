name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_MODE: demo
      APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PGLITE_DATA_DIR: ./data/ci
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependency versions
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests with migrations
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: echo "PLAYWRIGHT_EXECUTABLE_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Start isolated application
        run: |
          npm run start > ci-server.log 2>&1 &
          echo $! > ci-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$APP_URL/api?resource=bootstrap" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat ci-server.log
          exit 1
      - name: Browser scenarios
        run: npm run test:e2e
      - name: Stop test application
        if: always()
        run: |
          if test -f ci-server.pid; then kill "$(cat ci-server.pid)" || true; fi
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            ../../work/playwright-report/
            ../../work/playwright-results/
            ci-server.log
          retention-days: 7

# This workflow contains no deployment or production secrets.
# Execution on GitHub has not occurred merely because this file exists.
